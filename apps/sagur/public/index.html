<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>סָגוּר — הצעות מחיר שנסגרות</title>
<meta name="description" content="הצעות מחיר מקצועיות מהנייד, עם חתימה דיגיטלית של הלקוח ומעקב אחרי מה שנסגר.">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="סגור">
</head>
<body>

<!-- Boot splash, replaced as soon as the session is known -->
<div id="boot" class="boot"><div class="boot-mark">ס</div></div>

<!-- Signed out -->
<section id="authView" class="auth" hidden>
  <div class="auth-hero">
    <div class="auth-mark">ס</div>
    <h1>סָגוּר</h1>
    <p>הצעת מחיר מקצועית מהנייד בדקה. הלקוח חותם בקישור — ואתם יודעים בדיוק מה נסגר.</p>
    <ul class="auth-points">
      <li>חתימה דיגיטלית של הלקוח, ישירות מהטלפון</li>
      <li>מחירון קבוע — הצעה חדשה בכמה הקלקות</li>
      <li>רואים מתי הלקוח פתח את ההצעה — ומי צריך מעקב</li>
    </ul>
  </div>

  <div class="auth-card">
    <div class="tabs" role="tablist">
      <button class="tab is-active" data-auth-tab="login" role="tab">התחברות</button>
      <button class="tab" data-auth-tab="register" role="tab">פתיחת חשבון</button>
    </div>

    <form id="loginForm" class="stack" autocomplete="on">
      <label class="field"><span>אימייל</span>
        <input type="email" name="email" required autocomplete="username" inputmode="email"></label>
      <label class="field"><span>סיסמה</span>
        <input type="password" name="password" required autocomplete="current-password"></label>
      <p class="form-error" data-error hidden></p>
      <button class="btn btn-primary btn-block" type="submit">כניסה</button>
    </form>

    <form id="registerForm" class="stack" hidden autocomplete="on">
      <label class="field"><span>שם העסק</span>
        <input type="text" name="business_name" placeholder="למשל: מ. חכים מיזוג אוויר" autocomplete="organization"></label>
      <label class="field"><span>אימייל</span>
        <input type="email" name="email" required autocomplete="username" inputmode="email"></label>
      <label class="field"><span>סיסמה</span>
        <input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
      <p class="form-hint">14 יום ניסיון מלא, בלי כרטיס אשראי.</p>
      <p class="form-error" data-error hidden></p>
      <button class="btn btn-primary btn-block" type="submit">פתיחת חשבון</button>
    </form>
  </div>
</section>

<!-- Signed in -->
<div id="appView" hidden>
  <header class="topbar">
    <div class="topbar-inner">
      <h1 id="topbarTitle">בית</h1>
      <div class="topbar-actions" id="topbarActions"></div>
    </div>
  </header>

  <main id="viewRoot" class="view"></main>

  <nav class="tabbar" aria-label="ניווט ראשי">
    <a href="#/" data-tab="/" class="tabbar-item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>
      <span>בית</span></a>
    <a href="#/quotes" data-tab="/quotes" class="tabbar-item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h8l4 4v16H6zM14 2v5h5"/></svg>
      <span>הצעות</span></a>
    <a href="#/quotes/new" data-tab="/quotes/new" class="tabbar-item tabbar-item--cta" aria-label="הצעה חדשה">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>חדשה</span></a>
    <a href="#/customers" data-tab="/customers" class="tabbar-item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8M4 21a8 8 0 0 1 16 0"/></svg>
      <span>לקוחות</span></a>
    <a href="#/settings" data-tab="/settings" class="tabbar-item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6M4 12h2m12 0h2M12 4v2m0 12v2M6.3 6.3l1.4 1.4m8.6 8.6 1.4 1.4m0-11.4-1.4 1.4m-8.6 8.6-1.4 1.4"/></svg>
      <span>הגדרות</span></a>
  </nav>
</div>

<div id="sheetRoot"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="/app.js" type="module"></script>
</body>
</html>
